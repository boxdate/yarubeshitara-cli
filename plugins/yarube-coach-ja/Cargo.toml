[package]
name = "yarube-coach-ja"
version = "0.1.0"
edition = "2021"

[lib]
name = "yarube_coach_ja"
path = "src/lib.rs"

[[bin]]
name = "yarube-coach-ja"
path = "src/main.rs"

[dependencies]
candle-core = "0.11.1"
candle-nn = "0.11.1"
# GitHub公開時: candle-plamo3 = { git = "https://github.com/boxdate/candle-plamo3", tag = "v0.1.0" }
candle-plamo3 = { path = "/home/boxdate/WorkSpace/Self-Coaching_AI_Sample/candle-spike/crates/candle-plamo3" }
candle-transformers = "0.11.1"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

[profile.release]
opt-level = 2
lto = "off"
codegen-units = 16

[profile.release.package.yarube-coach-ja]
opt-level = 0

[profile.dev]
debug = false

[profile.test]
debug = false

[profile.release.build-override]
opt-level = 0
