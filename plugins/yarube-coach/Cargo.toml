[package]
name = "yarube-coach"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "yarube-coach"
path = "src/main.rs"

[dependencies]
candle-core = "0.11.1"
candle-transformers = "0.11.1"
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

[profile.release]
opt-level = 2
lto = true
codegen-units = 4

[profile.dev]
debug = false

[profile.test]
debug = false

[profile.release.build-override]
opt-level = 0
